<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#071411">
    <title>Agenda Sacramental</title>
    <link rel="icon" type="image/webp" href="./assets/app-icon.webp">
    <link rel="shortcut icon" type="image/webp" href="./assets/app-icon.webp">
    <link rel="apple-touch-icon" href="./assets/app-icon.webp">
    <link rel="stylesheet" href="./styles.css?v=20260710-5">
  </head>
  <body>
    <div id="app" class="app-shell setup-mode">
      <aside class="sidebar" aria-label="Navegación principal">
        <button id="brand-home" class="brand-block brand-link" type="button" aria-label="Ir al inicio">
          <img class="brand-mark" src="./assets/app-icon.webp" alt="" aria-hidden="true">
          <div>
            <p class="eyebrow">Agenda</p>
            <h1>Sacramental</h1>
          </div>
        </button>

        <div id="session-chip" class="session-chip skeleton">Conectando...</div>

        <nav class="nav-list">
          <button class="nav-item active" data-route="agendas" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"></path><path d="M4 5.5v16"></path><path d="M8 7h8"></path><path d="M8 11h6"></path></svg>
            </span>
            <span>Agendas</span>
          </button>
          <button class="nav-item" data-route="planning" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg class="svg-icon" viewBox="0 0 24 24"><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path></svg>
            </span>
            <span>Planificación</span>
          </button>
          <button class="nav-item" data-route="settings" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 21v-7"></path><path d="M4 10V3"></path><path d="M12 21v-9"></path><path d="M12 8V3"></path><path d="M20 21v-5"></path><path d="M20 12V3"></path><path d="M2 14h4"></path><path d="M10 8h4"></path><path d="M18 16h4"></path></svg>
            </span>
            <span>Ajustes</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <p>Agenda Sacramental</p>
          <small id="sidebar-footer-unit">&copy; 2026 &middot; Unidad</small>
        </div>
      </aside>

      <section class="workspace" aria-live="polite">
        <header class="topbar">
          <div>
            <p id="topbar-eyebrow" class="eyebrow">Unidad</p>
            <h2 id="topbar-title">Agenda Sacramental</h2>
          </div>
          <div class="topbar-actions">
            <button id="change-unit" class="chip-button" type="button">
              <span class="button-icon" aria-hidden="true">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M8 7h13"></path><path d="m18 4 3 3-3 3"></path><path d="M16 17H3"></path><path d="m6 14-3 3 3 3"></path></svg>
              </span>
              <span>Cambiar unidad</span>
            </button>
            <button id="sign-out" class="chip-button danger-chip" type="button">
              <span class="button-icon" aria-hidden="true">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
              </span>
              <span>Salir</span>
            </button>
          </div>
        </header>

        <main id="screen" class="screen">
          <div class="loading-panel">
            <div class="spinner"></div>
            <span>Cargando...</span>
          </div>
        </main>
      </section>
    </div>

    <dialog id="modal" class="modal"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./hymns.js?v=20260710-3"></script>
    <script type="module" src="./app.js?v=20260710-5"></script>
  </body>
</html>
